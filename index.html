<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>遊樂場 Mini Games</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #333333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        header { margin-bottom: 20px; text-align: center; }
        
        nav { margin-bottom: 30px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        nav button {
            padding: 10px 18px; font-size: 15px; border: none; border-radius: 8px;
            background-color: #ddd; cursor: pointer; transition: 0.2s; font-weight: bold;
        }
        nav button.active { background-color: var(--primary); color: white; }

        .game-container {
            background: var(--card-bg); padding: 30px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 500px;
            min-height: 300px; display: none; text-align: center; box-sizing: border-box;
        }
        .game-container.active { display: block; }

        input, button.game-btn {
            padding: 10px; font-size: 16px; margin: 10px 5px; border-radius: 6px; border: 1px solid #ccc;
        }
        button.game-btn { background: var(--primary); color: white; border: none; cursor: pointer; font-weight: bold;}
        
        .overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; 
            background: rgba(0,0,0,0.75); display: flex; justify-content: center; 
            align-items: center; z-index: 999; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 12px; max-width: 450px; 
            width: 100%; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-btns { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
        .btn-agree { background-color: var(--success); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;}
        .btn-cancel { background-color: var(--danger); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;}
        #block-screen { display: none; color: white; text-align: center; font-size: 24px; font-weight: bold;}

        #reaction-box {
            width: 100%; height: 200px; background-color: var(--danger); color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px;
            user-select: none;
        }

        .memory-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
        .memory-card {
            height: 70px; background-color: #34495e; color: transparent;
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; border-radius: 8px; cursor: pointer; user-select: none; transition: transform 0.2s;
        }
        .memory-card.flipped { background-color: #f1c40f; color: #fff; transform: rotateY(180deg); }
        .memory-card.matched { background-color: var(--success); color: #fff; cursor: default; }

        .whack-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .whack-hole {
            height: 90px; background-color: #795548; border-radius: 50%;
            position: relative; overflow: hidden; cursor: pointer; border: 4px solid #5d4037;
        }
        .whack-mole {
            width: 100%; height: 100%; background-color: #ffb74d; border-radius: 50%;
            position: absolute; top: 100%; transition: top 0.1s;
        }
        .whack-hole.active .whack-mole { top: 15%; background-color: #a1887f; }

        .wheel-container { position: relative; width: 200px; height: 200px; margin: 20px auto; }
        #canvas-wheel { border-radius: 50%; transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .wheel-pointer {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-top: 25px solid #e74c3c; z-index: 10;
        }

        footer { margin-top: auto; padding: 30px 0 10px 0; font-size: 14px; color: #888; text-align: center; width: 100%; }
    </style>
</head>
<body>

    <header>
        <h1>小遊戲精選集</h1>
        <p>切換上方選單開始玩遊戲吧！</p>
    </header>

    <nav>
        <button onclick="switchGame('guess')" id="btn-guess" class="active">🔢 猜數字</button>
        <button onclick="switchGame('reaction')" id="btn-reaction">⚡ 反應時間</button>
        <button onclick="switchGame('memory')" id="btn-memory">🧠 翻牌配對</button>
        <button onclick="switchGame('whack')" id="btn-whack">🔨 打地鼠</button>
        <button onclick="switchGame('wheel')" id="btn-wheel">🎡 幸運輪盤</button>
    </nav>

    <div id="game-guess" class="game-container active">
        <h2>🔢 終極猜數字 (1-100)</h2>
        <p id="guess-hint">請在下方輸入數字開始猜...</p>
        <input type="number" id="guess-input" min="1" max="100" style="width: 80px; text-align: center;">
        <br>
        <button class="game-btn" onclick="checkGuess()">送出答案</button>
        <button class="game-btn" onclick="resetGuess()" style="background:#888;">重置新局</button>
    </div>

    <div id="game-reaction" class="game-container">
        <h2>⚡ 反應時間測試</h2>
        <p>點擊下方方塊開始。當方塊變為 <strong>綠色</strong> 時，請「立刻」點擊它！</p>
        <div id="reaction-box" onclick="handleReactionClick()">點擊這裡開始</div>
        <p id="reaction-result" style="font-weight: bold; font-size: 18px; margin-top: 15px;"></p>
    </div>

    <div id="game-memory" class="game-container">
        <h2>🧠 翻牌記憶配對</h2>
        <p>找出所有配對的水果卡牌！ 步數：<span id="memory-flips">0</span></p>
        <div class="memory-grid" id="memory-board"></div>
        <button class="game-btn" onclick="resetMemory()" style="margin-top:20px; background:#888;">重新洗牌</button>
    </div>

    <div id="game-whack" class="game-container">
        <h2>🔨 瘋狂打地鼠 (15秒挑戰)</h2>
        <p>得分：<span id="whack-score" style="font-weight:bold; color:var(--primary);">0</span> | 剩餘時間：<span id="whack-time">15</span> 秒</p>
        <button class="game-btn" id="whack-start-btn" onclick="startWhack()">開始遊戲</button>
        <div class="whack-grid">
            <div class="whack-hole" onclick="hitMole(0)"><div class="whack-mole"></div></div>
            <div class="whack-hole" onclick="hitMole(1)"><div class="whack-mole"></div></div>
            <div class="whack-hole" onclick="hitMole(2)"><div class="whack-mole"></div></div>
            <div class="whack-hole" onclick="hitMole(3)"><div class="whack-mole"></div></div>
            <div class="whack-hole" onclick="hitMole(4)"><div class="whack-mole"></div></div>
            <div class="whack-hole" onclick="hitMole(5)"><div class="whack-mole"></div></div>
        </div>
    </div>

    <div id="game-wheel" class="game-container">
        <h2>🎡 命運幸運大輪盤</h2>
        <p>今天運氣如何？轉動輪盤測試吧！</p>
        <div class="wheel-container">
            <div class="wheel-pointer"></div>
            <canvas id="canvas-wheel" width="200" height="200"></canvas>
        </div>
        <button class="game-btn" id="wheel-spin-btn" onclick="spinWheel()">開始抽籤</button>
        <p id="wheel-result" style="font-size: 20px; font-weight: bold; color: #e67e22; margin-top: 15px;"></p>
    </div>

    <footer>
        🌟 大同大學 胡鈞揚 版權所有 © 2026  👾
    </footer>

    <script>
        function switchGame(gameId) {
            document.querySelectorAll('.game-container').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            
            document.getElementById(`game-${gameId}`).classList.add('active');
            document.getElementById(`btn-${gameId}`).classList.add('active');
            
            if(gameId === 'guess') resetGuess();
            if(gameId === 'reaction') resetReaction();
            if(gameId === 'memory') resetMemory();
            if(gameId === 'whack') endWhackGame();
            if(gameId === 'wheel') initWheel();
        }

        let targetNumber = Math.floor(Math.random() * 100) + 1;
        function checkGuess() {
            const input = document.getElementById('guess-input');
            const hint = document.getElementById('guess-hint');
            const guess = parseInt(input.value);
            if (isNaN(guess)) { hint.innerText = "請輸入有效的數字！"; return; }
            
            if (guess === targetNumber) { hint.innerText = "🎉 答對了！答案就是 " + targetNumber; hint.style.color = "var(--success)";} 
            else if (guess < targetNumber) { hint.innerText = "📉 太小了，再大一點！"; hint.style.color = "var(--text)";} 
            else { hint.innerText = "📈 太大了，再小一點！"; hint.style.color = "var(--text)";}
        }
        function resetGuess() {
            targetNumber = Math.floor(Math.random() * 100) + 1;
            document.getElementById('guess-hint').innerText = "新一輪開始！請輸入數字 (1-100)...";
            document.getElementById('guess-hint').style.color = "var(--text)";
            document.getElementById('guess-input').value = "";
        }

        let reactionState = "idle"; 
        let startTime, timerTimeout;
        const rBox = document.getElementById('reaction-box');
        const rResult = document.getElementById('reaction-result');

        function resetReaction() {
            clearTimeout(timerTimeout);
            reactionState = "idle";
            rBox.style.backgroundColor = "var(--danger)";
            rBox.innerText = "點擊這裡開始";
            rResult.innerText = "";
        }
        function handleReactionClick() {
            if (reactionState === "idle") {
                reactionState = "waiting";
                rBox.style.backgroundColor = "#f1c40f";
                rBox.innerText = "等候綠燈...";
                rResult.innerText = "";
                
                const randomDelay = Math.random() * 3000 + 2000;
                timerTimeout = setTimeout(() => {
                    reactionState = "ready";
                    rBox.style.backgroundColor = "var(--success)";
                    rBox.innerText = "就是現在！點擊！！！";
                    startTime = Date.now();
                }, randomDelay);
            } else if (reactionState === "waiting") {
                clearTimeout(timerTimeout);
                reactionState = "idle";
                rBox.style.backgroundColor = "var(--danger)";
                rBox.innerText = "太快了！按此重試";
                rResult.innerText = "❌ 偷跑！請在變綠燈後再點擊。";
            } else if (reactionState === "ready") {
                const duration = Date.now() - startTime;
                reactionState = "idle";
                rBox.style.backgroundColor = "#34495e";
                rBox.innerText = "挑戰結束！再玩一次";
                rResult.innerText = `⏱️ 您的反應時間是：${duration} 毫秒 (ms)！`;
            }
        }

        const items = ['🍎', '🍎', '🍌', '🍌', '🍇', '🍇', '🍉', '🍉', '🍒', '🍒', '🍓', '🍓', '🥑', '🥑', '🍍', '🍍'];
        let flippedCards = [];
        let matchedCount = 0;
        let flipCount = 0;
        let isWaiting = false;

        function resetMemory() {
            const board = document.getElementById('memory-board');
            board.innerHTML = '';
            flippedCards = [];
            matchedCount = 0;
            flipCount = 0;
            isWaiting = false;
            document.getElementById('memory-flips').innerText = flipCount;

            const shuffled = [...items].sort(() => Math.random() - 0.5);
            shuffled.forEach((item, index) => {
                const card = document.createElement('div');
                card.classList.add('memory-card');
                card.dataset.value = item;
                card.dataset.id = index;
                card.innerText = item;
                card.addEventListener('click', flipCard);
                board.appendChild(card);
            });
        }
        function flipCard() {
            if (isWaiting || this.classList.contains('flipped') || this.classList.contains('matched')) return;

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                flipCount++;
                document.getElementById('memory-flips').innerText = flipCount;
                isWaiting = true;

                if (flippedCards[0].dataset.value === flippedCards[1].dataset.value) {
                    flippedCards[0].classList.add('matched');
                    flippedCards[1].classList.add('matched');
                    matchedCount += 2;
                    flippedCards = [];
                    isWaiting = false;
                    if (matchedCount === items.length) {
                        setTimeout(() => alert(`🎉 太強了！你花了 ${flipCount} 步完成配對！`), 300);
                    }
                } else {
                    setTimeout(() => {
                        flippedCards[0].classList.remove('flipped');
                        flippedCards[1].classList.remove('flipped');
                        flippedCards = [];
                        isWaiting = false;
                    }, 1000);
                }
            }
        }

        let whackScore = 0;
        let whackTimeLeft = 15;
        let whackActiveHole = -1;
        let whackGameInterval, whackMoleTimeout;
        let isWhackPlaying = false;

        function startWhack() {
            if (isWhackPlaying) return;
            isWhackPlaying = true;
            whackScore = 0;
            whackTimeLeft = 15;
            document.getElementById('whack-score').innerText = whackScore;
            document.getElementById('whack-time').innerText = whackTimeLeft;
            document.getElementById('whack-start-btn').style.display = 'none';

            whackGameInterval = setInterval(() => {
                whackTimeLeft--;
                document.getElementById('whack-time').innerText = whackTimeLeft;
                if (whackTimeLeft <= 0) {
                    endWhackGame();
                    alert(`⏰ 時間到！你的最終得分是：${whackScore} 分！`);
                }
            }, 1000);

            showMole();
        }
        function showMole() {
            if (!isWhackPlaying) return;
            const holes = document.querySelectorAll('.whack-hole');
            holes.forEach(h => h.classList.remove('active'));

            let randHole;
            do { randHole = Math.floor(Math.random() * 6); } while (randHole === whackActiveHole);
            
            whackActiveHole = randHole;
            holes[whackActiveHole].classList.add('active');

            const duration = Math.random() * 400 + 600;
            whackMoleTimeout = setTimeout(() => {
                showMole();
            }, duration);
        }
        function hitMole(holeIndex) {
            if (!isWhackPlaying) return;
            if (holeIndex === whackActiveHole) {
                whackScore++;
                document.getElementById('whack-score').innerText = whackScore;
                document.querySelectorAll('.whack-hole')[whackActiveHole].classList.remove('active');
                whackActiveHole = -1;
                clearTimeout(whackMoleTimeout);
                showMole();
            }
        }
        function endWhackGame() {
            isWhackPlaying = false;
            clearInterval(whackGameInterval);
            clearTimeout(whackMoleTimeout);
            document.querySelectorAll('.whack-hole').forEach(h => h.classList.remove('active'));
            document.getElementById('whack-start-btn').style.display = 'inline-block';
        }

        const options = ["大吉", "中吉", "小吉", "末吉", "凶", "大凶"];
        const colors = ["#ff9999", "#ffcc99", "#ffff99", "#b3ffb3", "#99ccff", "#cc99ff"];
        let startAngle = 0;
        const arc = Math.PI / (options.length / 2);
        let isSpinning = false;

        function initWheel() {
            const canvas = document.getElementById("canvas-wheel");
            if (!canvas.getContext) return;
            const ctx = canvas.getContext("2d");
            ctx.clearRect(0,0,200,200);
            
            for (let i = 0; i < options.length; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.moveTo(100, 100);
                ctx.arc(100, 100, 100, angle, angle + arc, false);
                ctx.lineTo(100, 100);
                ctx.fill();

                ctx.save();
                ctx.fillStyle = "#333";
                ctx.font = "bold 12px sans-serif";
                ctx.translate(100 + Math.cos(angle + arc / 2) * 60, 100 + Math.sin(angle + arc / 2) * 60);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                ctx.fillText(options[i], -ctx.measureText(options[i]).width / 2, 0);
                ctx.restore();
            }
        }
        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('wheel-result').innerText = "命運之輪瘋狂轉動中...";
            
            const spinAngleStart = Math.random() * 1000 + 2000;
            const wheel = document.getElementById('canvas-wheel');
            wheel.style.transform = `rotate(${spinAngleStart}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const degrees = spinAngleStart % 360;
                
                const index = Math.floor(((360 - degrees + 270) % 360) / (360 / options.length));
                document.getElementById('wheel-result').innerText = `🎉 你的籤是：【${options[index]}】`;
            }, 4000); 
        }

        window.onload = () => {
            initWheel();
        };
    </script>
</body>
</html>
